# Builds the Docker image and publishes it to GitHub's container registry as
# ghcr.io/natewhi/postfalcon, for the one-line installer (install.sh) and image-based installs
# (deploy/docker-compose.image.yml). Publishing only: nothing here deploys anywhere, and
# postfalcon.co itself still deploys by hand with scripts/deploy.sh.
#
# Tags: `latest` and `sha-<commit>` on every push to main; `<version>` for a v* tag.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # amd64 for most servers, arm64 for ARM ones (Raspberry Pi, Oracle Ampere, Apple silicon).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Names the commit inside the image, for Admin -> Overview -> Version (lib/version.js).
          build-args: APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
