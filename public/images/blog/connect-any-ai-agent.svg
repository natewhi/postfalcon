<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A central node connected to three agent nodes with a plug joining one of them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <circle cx="990" cy="120" r="230" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="130" cy="560" r="190" fill="#ffffff" fill-opacity="0.06"/>

  <rect x="436" y="178" width="360" height="340" rx="36" fill="#000000" fill-opacity="0.16"/>
  <rect x="420" y="160" width="360" height="340" rx="36" fill="#ffffff"/>

  <g stroke="#4c1d95" stroke-width="4" stroke-opacity="0.55">
    <line x1="600" y1="330" x2="510" y2="240"/>
    <line x1="600" y1="330" x2="690" y2="240"/>
    <line x1="600" y1="330" x2="600" y2="430"/>
  </g>

  <circle cx="600" cy="330" r="38" fill="#4c1d95"/>
  <rect x="588" y="318" width="24" height="24" rx="6" fill="#ffffff"/>

  <circle cx="510" cy="240" r="26" fill="#ffffff" stroke="#4c1d95" stroke-width="4"/>
  <circle cx="510" cy="240" r="8" fill="#4c1d95"/>
  <circle cx="690" cy="240" r="26" fill="#ffffff" stroke="#4c1d95" stroke-width="4"/>
  <circle cx="690" cy="240" r="8" fill="#4c1d95"/>

  <circle cx="600" cy="430" r="26" fill="#ffffff" stroke="#4c1d95" stroke-width="4"/>
  <rect x="591" y="422" width="8" height="16" rx="3" fill="#4c1d95"/>
  <rect x="601" y="422" width="8" height="16" rx="3" fill="#4c1d95"/>
</svg>
